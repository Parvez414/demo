# ------------------------------------------------------------------------------
# 1. Application Under Test & Primary Navigation
# ------------------------------------------------------------------------------
base.url=https://opensource-demo.orangehrmlive.com/web/index.php/auth/login

# ------------------------------------------------------------------------------
# 2. Core Execution & Browser Settings
# ------------------------------------------------------------------------------
engine=selenium
engine.type=selenium
browser=chrome
headless=false
execution.mode=local
page.load.strategy=normal
element.highlight=true
thread.count=2
environment=qa
test.retry.count=1
execution.delay.ms=300

# ------------------------------------------------------------------------------
# 3. Timeouts & Polling
# ------------------------------------------------------------------------------
timeout.explicit=20
timeout.implicit=0
timeout.pageload=60
timeout.retry.count=3
timeout.polling.ms=500

# ------------------------------------------------------------------------------
# 4. Centralized Web Management Dashboard, Telemetry Hub & 30-Day License
# ------------------------------------------------------------------------------
# Point to your central server's IP / Domain
ai.telemetry.enabled=true
ai.telemetry.url=https://healqa.in/api/v1/telemetry/report
dashboard.telemetry.enabled=true
dashboard.telemetry.url=https://healqa.in/api/v1/telemetry/report
ai.telemetry.cost.per.hour=75.0
ai.telemetry.minutes.per.heal=25.0

# Optional: Associate with Organization & Project
platform.organization.id=org_cefe991b
platform.project.id=healqa-starter-suite
platform.api.key=ayt_live_84023de214248b350e31903add82e5f54c35d5b705e59cf5
platform.access.key=ayt_live_84023de214248b350e31903add82e5f54c35d5b705e59cf5
platform.api.url=https://healqa.in/api/v1

# ------------------------------------------------------------------------------
# 5. Remote Grid & Cloud Platforms (BrowserStack, SauceLabs, LambdaTest, Docker)
# ------------------------------------------------------------------------------
grid.url=http://localhost:4444/wd/hub
cloud.provider=
cloud.username=
cloud.accesskey=
cloud.project.name=HealQA Enterprise Suite
cloud.build.name=Build-1.0.0
cloud.os=Windows
cloud.os.version=11

# ------------------------------------------------------------------------------
# 6. Multi-Provider AI Self-Healing Engine Settings
# ------------------------------------------------------------------------------
ai.healing.enabled=true
ai.healing.provider=hybrid
ai.provider.fallback=
ai.runtime.healing.enabled=true
ai.healing.confidence.threshold=0.70

ai.gemini.api.key=
ai.gemini.model=gemini-1.5-flash
ai.gemini.temperature=0.1
ai.gemini.timeout.seconds=30

ai.openai.api.key=
ai.openai.model=gpt-4o-mini
ai.openai.timeout.seconds=20

ai.azure.openai.endpoint=
ai.azure.openai.api.key=
ai.azure.openai.deployment.name=gpt-4o
ai.azure.openai.api.version=2024-02-15-preview

ai.claude.api.key=
ai.claude.model=claude-3-5-haiku-20241022
ai.claude.timeout.seconds=20

ai.ollama.base.url=http://localhost:11434
ai.ollama.model=deepseek-r1:8b
ai.ollama.timeout.seconds=30

# ------------------------------------------------------------------------------
# 7. Smart Visual Stability & Screenshot Utility
# ------------------------------------------------------------------------------
screenshot.wait.spinners.enabled=true
screenshot.spinners.timeout.seconds=10
screenshot.spinners.custom.css=
screenshot.dismiss.overlays.enabled=true
screenshot.overlays.custom.css=
screenshot.stabilization.buffer.ms=400

# ------------------------------------------------------------------------------
# 8. Playwright Dual-Engine Settings (for Playwright Feature Suites)
# ------------------------------------------------------------------------------
playwright.browser=chromium
playwright.headless=true
playwright.slowmo.ms=0
playwright.timeout=15
playwright.navigation.timeout=30
playwright.block.ads=true
playwright.viewport.width=1920
playwright.viewport.height=1080
playwright.video.enabled=false
playwright.trace.enabled=false

# ------------------------------------------------------------------------------
# 9. User Session Management & Platform User Pool
# ------------------------------------------------------------------------------
user.session.mode=pool
user.pool=Admin:admin123:admin

# ------------------------------------------------------------------------------
# 10. Git Auto-Patch & Self-Healing PR Generator (GitHub, GitLab, Bitbucket, Azure)
# ------------------------------------------------------------------------------
ai.autopatch.enabled=false
ai.autopatch.auto.branch=true
ai.autopatch.branch.prefix=ai-heal/patch-
ai.autopatch.git.commit=true
ai.autopatch.create.pr=false

# ------------------------------------------------------------------------------
# 11. Database & Hybrid Persistence Settings
# ------------------------------------------------------------------------------
db.type=auto
db.host=localhost
db.port=3306
db.name=automation_db
db.username=root
db.password=root
db.pool.maxSize=10
db.pool.minIdle=2
db.pool.timeoutMs=4000
